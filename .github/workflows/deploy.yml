name: CI/CD - MesaFacil.API (Docker)

on:
  push:
    branches:
      - Development
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Homelab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ejecutar pruebas unitarias
        run: |
          dotnet restore MesaFacil.API.sln
          dotnet test MesaFacil.API.sln -c Release --verbosity normal

      - name: Obtener nombre de usuario en minúsculas
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen Docker en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/mesafacil-api:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/mesafacil-api:${{ github.sha }}

      # Conectar a Tailscale justo antes del despliegue (evita interferencias con Docker Buildx)
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # Esperar a que el túnel Tailscale hacia Homelab esté caliente y listo
      - name: Verificar conectividad Tailscale hacia Homelab
        run: |
          echo "Verificando ruta Tailscale hacia ${{ secrets.HOMELAB_HOST }}..."
          for i in $(seq 1 12); do
            if tailscale ping -c 1 ${{ secrets.HOMELAB_HOST }} >/dev/null 2>&1; then
              echo ">> Túnel Tailscale activo y listo."
              break
            fi
            echo "Esperando ruta WireGuard (intento $i/12)..."
            sleep 2
          done

      # Configurar clave SSH sanitizando posibles saltos de línea
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOMELAB_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # Despliegue con Docker Compose en Homelab
      - name: Desplegar en Homelab con Docker Compose
        run: |
          SSH_USER=$(echo "${{ secrets.SSH_USER }}" | tr -d '\r\n[:space:]')
          HOMELAB_HOST=$(echo "${{ secrets.HOMELAB_HOST }}" | tr -d '\r\n[:space:]')
          ssh -v -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "$SSH_USER@$HOMELAB_HOST" bash << 'EOF'
            set -e
            cd /opt/mesafacil
            docker compose pull api
            docker compose up -d --remove-orphans api
            echo ">> Contenedor mesafacil-api desplegado exitosamente."
          EOF
